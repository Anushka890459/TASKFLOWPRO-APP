<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Projects</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .project-card { border-radius: 12px; transition: 0.3s; border: none; }
    .project-card:hover { transform: scale(1.02); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .navbar { background-color: #2c3e50; }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/dashboard">TaskFlow Pro</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/dashboard">Dashboard</a>
      <a class="nav-link active" href="/projects">Projects</a>
      <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="nav-link btn btn-link text-danger" style="text-decoration: none;">Logout</button>
      </form>
    </div>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Your Projects</h2>
    <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#projectModal">+ New Project</button>
  </div>


  <div class="row">

    <div class="col-md-4 mb-4" th:each="project : ${projects}">
      <div class="card project-card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title text-primary" th:text="${project.name}">Project Name</h5>
          <p class="card-text text-muted" th:text="${project.description}">Short description.</p>
        </div>
        <div class="card-footer bg-white border-top-0">
                    <span class="badge bg-secondary rounded-pill"
                          th:text="${(project.tasks != null ? project.tasks.size() : 0) + ' Tasks'}">0 Tasks</span>
        </div>
      </div>
    </div>


    <div class="col-12 text-center py-5" th:if="${projects == null || projects.isEmpty()}">
      <h4 class="text-muted">No projects added yet.</h4>
      <p>Click the button above to start your first project!</p>
    </div>
  </div>
</div>


<div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create New Project</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form th:action="@{/projects/save}" method="post">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Project Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Java Backend API" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Tell us about the project..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Save Project</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
