<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow Pro | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .stats-card { border-radius: 10px; transition: 0.3s; border: none; }
    .stats-card:hover { transform: translateY(-5px); }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
  <div class="container">
    <a class="navbar-brand" href="#">TaskFlow Pro</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link active" href="/dashboard">Dashboard</a>
      <a class="nav-link" href="/projects">Projects</a>
      <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="nav-link btn btn-link text-danger" style="text-decoration: none;">Logout</button>
      </form>
    </div>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Project Dashboard</h2>
    <span class="badge bg-info text-dark" th:text="${'Logged in as: ' + user.role}">Role</span>
  </div>

  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card stats-card bg-primary text-white shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Pending Tasks</h5>
          <h2 th:text="${pendingCount != null ? pendingCount : 0}">0</h2>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card stats-card bg-success text-white shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Completed Tasks</h5>
          <h2 th:text="${completedCount != null ? completedCount : 0}">0</h2>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card stats-card bg-danger text-white shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Alert: Overdue</h5>
          <h2 th:text="${overdueTasks != null ? overdueTasks.size() : 0}">0</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-4" th:if="${overdueTasks != null && !overdueTasks.isEmpty()}">
    <div class="card-header bg-danger text-white fw-bold">⚠️ Overdue Tasks Checklist</div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
        <tr><th>Title</th><th>Project</th><th>Due Date</th><th>Action</th></tr>
        </thead>
        <tbody>
        <tr th:each="task : ${overdueTasks}">
          <td th:text="${task.title}">Title</td>
          <td th:text="${task.project.name}">Project</td>
          <td class="text-danger fw-bold" th:text="${task.dueDate}">Date</td>
          <td>
            <form th:action="@{'/tasks/update-status/' + ${task.id}}" method="post">
              <input type="hidden" name="status" value="Completed">
              <button type="submit" class="btn btn-sm btn-outline-success">Mark Done</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card shadow-sm mb-5">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <span class="fw-bold">Active Projects</span>
      <a th:if="${user.role == 'ADMIN'}" href="/projects" class="btn btn-sm btn-primary">+ New Project</a>
    </div>
    <div class="card-body">
      <div class="list-group list-group-flush">
        <div th:each="project : ${projects}" class="list-group-item py-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h6 class="mb-0 fw-bold" th:text="${project.name}">Project Name</h6>
              <small class="text-muted" th:text="${project.description}">Description</small>
            </div>
            <div>
              <span class="badge bg-secondary rounded-pill me-2" th:text="${(project.tasks != null ? project.tasks.size() : 0) + ' Tasks'}">0 Tasks</span>
              <a th:if="${user.role == 'ADMIN'}" th:href="@{'/projects/delete/' + ${project.id}}" class="btn btn-sm btn-outline-danger">Delete</a>
            </div>
          </div>

          <form th:if="${user.role == 'ADMIN'}" th:action="@{'/tasks/add/' + ${project.id}}" method="post" class="row g-2">
            <div class="col-sm-6">
              <input type="text" name="title" class="form-control form-control-sm" placeholder="Task title..." required>
            </div>
            <div class="col-sm-4">
              <input type="date" name="dueDate" class="form-control form-control-sm" required>
            </div>
            <div class="col-sm-2">
              <button type="submit" class="btn btn-sm btn-outline-primary w-100">+ Task</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
